<style>

.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}

.walk ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;overflow-x:auto}
.svgbox svg{width:100%;min-width:520px;height:auto;display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}

<script>
/* ===================== CONTENU ===================== */
const DAYS = [
 {id:"j1", date:"2026-10-25", tab:"Dim. 25", title:"Ghardaïa, Béni Isguen, palmeraie", meta:"Avec le guide",
  stops:[
   {t:"09:00",e:"11:00",name:"Ksar de Ghardaïa et son marché",sub:"Le plus grand ksar, cœur commercial de la vallée",tag:"Guide",place:"ghardaia",
    say:"Ghardaïa a été fondée vers mille quarante-huit ou mille cinquante-trois, selon les sources, par des Ibadites réfugiés de Tahert, l'actuelle Tiaret, après la chute du royaume rostémide. La légende donne à la ville le nom d'une jeune femme, Daïa, qui vivait dans une grotte : Ghar Daïa, la grotte de Daïa. On commence par la grande place du marché, rectangulaire, d'environ trois mille quatre cents mètres carrés, entourée d'arcades. Elle date de la fin du dix-neuvième siècle. Le marché plus ancien, la Rahba, se trouve à l'intérieur du ksar. Ensuite, on monte par les ruelles, qui tournent sans cesse : elles cassent le vent de sable, gardent l'ombre et gênent un assaillant. Regardez les entrées des maisons : c'est la skifa, une entrée en chicane. Depuis la rue, on ne voit jamais l'intérieur, car la maison est tournée vers son patio. Tout en haut, la grande mosquée et son minaret en forme de pyramide très allongée dominent la ville. La mosquée était aussi le dernier refuge en cas de siège, avec un arsenal et un silo à grains. On l'admire de l'extérieur, car on n'entre pas dans les mosquées.",
    kid:"Bienvenue à Ghardaïa ! Son nom vient d'une légende : une jeune femme, Daïa, vivait dans une grotte, et en arabe, une grotte se dit ghar. Ghar Daïa, ça a donné Ghardaïa. La ville est construite comme un gâteau en étages, avec une tour pointue tout en haut. Les rues tournent tout le temps, comme un labyrinthe. C'est fait exprès : le vent de sable ne peut pas s'engouffrer, et l'ombre reste dans la rue. Regardez les portes : quand elles sont ouvertes, on ne voit jamais l'intérieur, parce que le couloir fait un virage. Votre mission : trouver une porte bleue !",
    see:["La grande place à arcades, de la fin du XIXe siècle","Les ruelles qui tournent vers le sommet","La skifa, l'entrée en chicane des maisons","Le minaret en pyramide très allongée","Les tapis sous les arcades du marché"],
    ask:"Pouvez-vous nous montrer la Rahba, l'ancien marché, et nous expliquer les motifs d'un tapis ?",
    kids:"Comptez les virages entre la place et le minaret.",
    tip:"Les tapis de Ghardaïa sont en laine et poil de chèvre, à motifs géométriques, dominés par le rouge, le noir et l'ocre. Voir « Qu'acheter »."},
   {t:"11:15",e:"13:00",name:"Ksar de Béni Isguen",sub:"La cité la mieux préservée, guide local obligatoire",tag:"Guide",place:"beniisguen",
    say:"Béni Isguen est aujourd'hui considérée comme la ville sainte du M'Zab. Cette réputation est pourtant assez récente : au dix-neuvième siècle, c'était Melika qui portait ce titre, et Béni Isguen passait pour la cité militaire. On y entre par une lourde porte en troncs de palmier, et la visite se fait obligatoirement avec un guide local. L'ambiance change tout de suite : silence, rues impeccables. Au dix-neuvième siècle, toutes les portes de ses deux enceintes étaient fermées la nuit. Les règles sont strictes : on ne fume pas dans les rues, on porte une tenue couverte, et on ne photographie jamais les habitants. Les femmes mozabites portent un grand voile blanc. Montez jusqu'à la tour Boulila, le point le plus haut de la ville : la vue embrasse le ksar, les remparts et la palmeraie.",
    kid:"Ici, c'est la ville la plus calme de toute la vallée. On parle doucement, comme dans une bibliothèque. Les dames portent un grand voile blanc, et on ne les prend jamais en photo, c'est une règle très importante. La porte d'entrée est faite avec des troncs de palmier ! Montez jusqu'à la tour Boulila : autrefois, des veilleurs surveillaient le désert depuis les tours pour voir arriver les visiteurs de loin.",
    see:["La porte en troncs de palmier","Les ruelles silencieuses","Les remparts","La tour Boulila, point culminant, et sa vue"],
    rules:"Guide local obligatoire. Tenue couverte, épaules et jambes. Ne pas fumer. Aucune photo des habitants.",
    ask:"Pourquoi Béni Isguen a-t-elle remplacé Melika comme ville sainte ? Quel est le rôle des azzaba aujourd'hui ?",
    kids:"Jeu du silence : qui traverse une ruelle sans dire un mot ?"},
   {t:"13:00",e:"14:00",name:"Déjeuner",sub:"Spécialités mozabites et dattes de saison",tag:"Pause",
    say:"Pause déjeuner. Demandez si l'on sert une spécialité mozabite, comme l'ouchou souffer, un couscous aux herbes, ou l'ouchou tinni, un couscous aux dattes. Fin octobre, c'est la saison des dattes : goûtez-les fraîches. Voir la rubrique « Que manger »."},
   {t:"14:00",e:"15:30",name:"Repos",sub:"Piscine ou sieste, au plus chaud",tag:"Pause",
    say:"Repos au plus chaud de la journée. Piscine ou sieste au logement, avant la fin d'après-midi."},
   {t:"15:30",e:"16:00",name:"Marché à la criée de Béni Isguen",sub:"Place Lalla Achou, après le Asr, sauf le vendredi",tag:"Option",opt:true,place:"beniisguen",
    say:"Le marché à la criée de Béni Isguen se tient sur la place Lalla Achou, en bordure du ksar, tous les jours sauf le vendredi, sous le contrôle des azzaba, le conseil religieux. Il commence généralement en fin d'après-midi, après la prière du Asr. Un crieur fait le tour de la place avec les objets à vendre et annonce les prix à voix haute. Les acheteurs enchérissent d'un geste. On peut regarder sans rien acheter. Tradition locale : les femmes mozabites ne traversent pas la place du marché.",
    kid:"Une vente à la criée, c'est comme un jeu : un monsieur fait le tour de la place en criant un prix. Si quelqu'un veut l'objet plus cher, il fait un petit signe. Le dernier qui a fait signe gagne l'objet. Regardez bien qui lève la main !",
    see:["Le crieur qui fait le tour de la place","Les acheteurs qui enchérissent d'un geste"],
    ask:"Le marché a-t-il lieu aujourd'hui, et à quelle heure exactement ?"},
   {t:"16:00",e:"18:15",name:"Palmeraie, partage de l'eau, coucher de soleil",sub:"La clé de tout le M'Zab",tag:"Guide",place:"palmeraie",
    say:"La palmeraie est la clé du M'Zab. L'UNESCO considère le ksar, le cimetière et la palmeraie comme les trois éléments indissociables du site. Ici, il ne pleut presque jamais, mais l'oued M'Zab connaît des crues soudaines. Pendant des siècles, les Mozabites ont construit un système de captage, de stockage et de partage de cette eau de crue. Des barrages souterrains retiennent l'eau sous le lit de l'oued, comme de petites nappes. Des rigoles, des canalisations en pierre, des séguias et des aqueducs suivent la pente du terrain. Les tissembades, des canalisations en grandes pierres plates, cassent la vitesse de l'eau. Ensuite, de grands canaux distributeurs alimentent la palmeraie, et la part de chaque jardin est calculée selon sa surface et son nombre de palmiers. Des tours de guet surveillaient les crues. Aujourd'hui encore, une association, les Oumana El-Sayl, les gardiens des crues, gère ce patrimoine. La terrible crue du premier octobre deux mille huit a emporté une partie de ces ouvrages. Regardez aussi les maisons d'été : à la saison chaude, les familles quittaient le ksar pour vivre au frais, sous les palmiers. Au coucher du soleil, les palmiers deviennent des ombres noires et la lumière dorée glisse sur les murs.",
    kid:"Ici, il ne pleut presque jamais. Alors comment les palmiers ont-ils de l'eau ? Quand il y a un gros orage très loin, la rivière se remplit d'un coup. Les habitants ont construit des barrages pour attraper cette eau et la cacher sous la terre, comme dans une éponge. Ensuite, des canaux la partagent entre tous les jardins : plus un jardin a de palmiers, plus il reçoit d'eau. Et des gardiens surveillent que personne ne triche !",
    see:["Les canaux et les répartiteurs","Les canalisations en pierres plates","Les puits","Les maisons d'été","Le coucher de soleil"],
    ask:"Où sont les ouvrages des Oumana El-Sayl, et comment la part d'eau de chaque jardin est-elle calculée ?",
    kids:"Plus un jardin a de palmiers, plus il reçoit d'eau. Comptez les palmiers d'un jardin !"},
  ]},

    say:"Tafilalt, ou Tafilelt, est un ksar moderne bâti sur le plateau qui domine la vallée, au sud de Béni Isguen. L'idée naît dans les années mille neuf cent quatre-vingt-dix. En mille neuf cent quatre-vingt-dix-sept, Ahmed Nouh crée la fondation Amidoul, qui achète un terrain de vingt-deux hectares. Les premières maisons sont distribuées en deux mille, et la ville est inaugurée en deux mille quatre. Elle compte environ un millier de maisons et a atteint six mille habitants en deux mille treize. Le principe, c'est la touiza, l'entraide : la charte rend obligatoire la participation aux travaux d'intérêt général. Les maisons sont regroupées en îlots de vingt-huit à trente foyers, qui assurent la propreté à tour de rôle. Chaque habitant entretient un palmier, un arbre d'ornement et un arbre fruitier, et la moitié des eaux usées est recyclée. Le projet a reçu le prix de la Ligue arabe pour l'environnement en deux mille quatorze, et un prix de la ville durable à la COP vingt-deux de Marrakech. C'est un quartier habité : on le visite discrètement.",

const INTRO = "Aux dixième et onzième siècles, après la chute du royaume rostémide de Tahert, l'actuelle Tiaret, des Ibadites, une branche de l'islam minoritaire, se réfugient d'abord à Sedrata, près d'Ouargla, puis dans cette vallée aride de la Chebka du M'Zab. Entre mille douze et mille trois cent cinquante, ils y fondent cinq villes fortifiées : El Atteuf, Bounoura, Melika, Ghardaïa et Béni Isguen. C'est la pentapole du M'Zab, inscrite au patrimoine mondial de l'UNESCO en mille neuf cent quatre-vingt-deux. Le plan est toujours le même. La mosquée est bâtie comme une forteresse, dernier refuge en cas de siège, avec un arsenal et un silo à grains, et son minaret sert de tour de guet. Les maisons, des cubes de taille semblable, s'organisent en cercles autour d'elle jusqu'au rempart : c'est l'image d'une société égalitaire, qui protège l'intimité des familles. Autour du ksar, le cimetière et la palmeraie, avec ses maisons d'été. Les constructions sont en pierre, enduites à la chaux et au plâtre traditionnel. Ce modèle a fasciné les architectes du vingtième siècle : Le Corbusier, Fernand Pouillon, André Ravéreau.";

const SKY_TXT="Le soir du vingt-six octobre, dans les dunes, c'est la pleine lune. Elle se lève à l'est, presque au moment où le soleil se couche à l'ouest. Regardez-la sortir de l'horizon : elle paraît énorme et orange. Comme elle est très lumineuse, on verra moins d'étoiles que lors d'une nuit sans lune, mais le désert sera éclairé comme en plein jour gris. Vers dix-neuf heures trente, cherchez à l'est un point jaune pâle qui ne scintille pas : c'est probablement Saturne. Haut à l'ouest, trois étoiles brillantes forment un grand triangle : Véga, Deneb et Altaïr. Au nord-est, un W couché : c'est Cassiopée.";
/* ===================== ASTRONOMIE ===================== */
const LAT=32.49, LNG=3.67, TZ=1, R=Math.PI/180;
function jdOf(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545;const g=(357.529+0.98560028*D)%360,q=(280.459+0.98564736*D)%360;const L=q+1.915*Math.sin(g*R)+0.02*Math.sin(2*g*R),e=23.439-3.6e-7*D;
 let RA=Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15;RA=((RA%24)+24)%24;const decl=Math.asin(Math.sin(e*R)*Math.sin(L*R))/R;let eqt=q/15-RA;eqt=((eqt+12)%24+24)%24-12;return{decl,eqt}}
function dayTimes(iso){const [y,m,d]=iso.split("-").map(Number);const {decl,eqt}=sunPos(jdOf(y,m,d)+0.5-TZ/24);const noon=12+TZ-LNG/15-eqt;
 const c=a=>Math.acos((Math.sin(a*R)-Math.sin(decl*R)*Math.sin(LAT*R))/(Math.cos(decl*R)*Math.cos(LAT*R)))/R/15;
 const asrA=Math.atan(1/(1+Math.tan(Math.abs(LAT-decl)*R)))/R;
 return {fajr:noon-c(-18),sunrise:noon-c(-0.833),dhuhr:noon,asr:noon+c(asrA),maghrib:noon+c(-0.833),isha:noon+c(-17)}}
const hm=h=>{const m=Math.round(h*60);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const toMin=s=>{const [a,b]=s.split(":").map(Number);return a*60+b};
function moonAge(iso){const [y,m,d]=iso.split("-").map(Number);return ((jdOf(y,m,d)+0.75-2451550.1)%29.530588+29.530588)%29.530588}

function frVoices(){return synth?synth.getVoices().filter(v=>/^fr/i.test(v.lang)):[]}
function scoreVoice(v){let s=0;if(/fr(-|_)FR/i.test(v.lang))s+=2;if(/premium|enhanced|amélior|natural|neural|online/i.test(v.name))s+=5;if(/google/i.test(v.name))s+=3;if(/amélie|thomas|audrey|denise|henri|vivienne/i.test(v.name))s+=1;return s}
function pickVoice(){const v=frVoices();voice=v.find(x=>x.name===VNAME)||v.sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
const player=document.getElementById("player"),plbl=document.getElementById("plbl"),ppause=document.getElementById("ppause");
function stopAll(){AUD.onended=null;AUD.onerror=null;AUD.pause();curAudio=null;synth&&synth.cancel()}
function speakList(items){stopAll();queue=items;qi=0;paused=false;ppause.textContent="Pause";nextUtt()}
function ttsSpeak(it){if(!synth){note("La lecture audio n'est pas disponible sur cet appareil.");return}
 const u=new SpeechSynthesisUtterance(it.text);u.lang="fr-FR";if(voice)u.voice=voice;u.rate=RATE*(it.kid?1:0.97);u.pitch=it.kid?1.08:1;u.onend=()=>{qi++;nextUtt()};u.onerror=()=>{player.hidden=true};synth.speak(u)}
function nextUtt(){if(qi>=queue.length){player.hidden=true;curAudio=null;return}const it=queue[qi];player.hidden=false;plbl.textContent="Lecture : "+it.label;
 if(MODE==="naturelle"&&it.id){const a=AUD;curAudio=a;let fell=false;
  const fall=()=>{if(fell)return;fell=true;curAudio=null;ttsSpeak(it)};
  a.onended=()=>{curAudio=null;qi++;nextUtt()};a.onerror=fall;a.src="audio/"+it.id+".mp3";a.playbackRate=RATE;a.defaultPlaybackRate=RATE;
  const pr=a.play();if(pr&&pr.catch)pr.catch(fall);return}
 ttsSpeak(it)}
ppause.onclick=()=>{if(curAudio){if(paused){curAudio.play();paused=false;ppause.textContent="Pause"}else{curAudio.pause();paused=true;ppause.textContent="Reprendre"}return}
 if(!synth)return;if(paused){synth.resume();paused=false;ppause.textContent="Pause"}else{synth.pause();paused=true;ppause.textContent="Reprendre"}};
document.getElementById("pstop").onclick=()=>{stopAll();queue=[];player.hidden=true};
function note(m){plbl.textContent=m;player.hidden=false;setTimeout(()=>{if(!queue.length||qi>=queue.length)player.hidden=true},3500)}
/* Liste de tous les textes lus, pour générer les fichiers audio */
window.__ttsItems=()=>{const L=[];DAYS.forEach(d=>d.stops.forEach((s,i)=>{L.push({id:`${d.id}-${i}`,text:s.name+". "+s.say});if(s.kid)L.push({id:`${d.id}-${i}-k`,text:s.kid})}));
 L.push({id:"intro",text:INTRO});MUST.forEach((m,i)=>L.push({id:"must-"+i,text:m.name+". "+m.why+" Le saviez-vous ? "+m.know}));
 FOOD.forEach((f,i)=>L.push({id:"food-"+i,text:f.name+". "+f.what}));MANNERS.forEach(([a,b],i)=>L.push({id:"sv-"+i,text:a+". "+b}));
 SOCIETY.forEach(([a,b],i)=>L.push({id:"soc-"+i,text:a+". "+b}));WALKS.forEach(w=>w.pts.forEach((p,i)=>L.push({id:`${w.id}-${i}`,text:`Point ${i+1}. ${p.n}. ${p.t}`})));
 L.push({id:"ciel",text:SKY_TXT});return L};

  const play=i=>{started=true;cur=i;S.set(key,i);view.querySelectorAll(".walk li").forEach((li,j)=>li.classList.toggle("on",j===i));speakList([{id:`${w.id}-${i}`,label:`${i+1}. ${w.pts[i].n}`,text:`Point ${i+1}. ${w.pts[i].n}. ${w.pts[i].t}`}])};
  view.querySelectorAll("[data-wp]").forEach(b=>b.onclick=()=>play(+b.dataset.wp));
  document.getElementById("wnext").onclick=()=>play(started?Math.min(cur+1,w.pts.length-1):cur);
  document.getElementById("wreset").onclick=()=>{cur=0;S.set(key,0);draw()};
  document.getElementById("wall").onclick=()=>speakList(w.pts.map((p,i)=>({id:`${w.id}-${i}`,label:`${i+1}. ${p.n}`,text:`Point ${i+1}. ${p.n}. ${p.t}`})));
  wireGo()};draw()}
function renderUnderstand(){view.innerHTML=`${backBtn()}<h2>Comprendre</h2><p class="daymeta">Les dossiers de fond, comme en début de guide.</p>
 <h2>Histoire</h2><div class="card"><ol class="tl">${HISTORY.map(([y,t])=>`<li><div class="yr">${esc(y)}</div><div>${esc(t)}</div></li>`).join("")}</ol></div>
 <h2>Les Mozabites et l'ibadisme</h2><div class="toolbar"><button class="btn" type="button" id="psoc">▶ Écouter</button></div>
 <div class="card"><dl class="gloss">${SOCIETY.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div>
 <h2>Le plan d'un ksar</h2><div class="svgbox">${SVG_KSAR}</div><p class="small">Schéma simplifié d'après la description de l'UNESCO : mosquée-forteresse au sommet, maisons en cercles jusqu'au rempart, puis cimetière et palmeraie.</p>
 <h2>La maison mozabite</h2><div class="svgbox">${SVG_HOUSE}</div><p class="small">Schéma simplifié. La skifa coudée empêche de voir l'intérieur depuis la rue, et la maison s'organise autour de son patio.</p>
 <h2>Le chemin de l'eau</h2><div class="svgbox">${SVG_WATER}</div><p class="small">De la crue à la palmeraie : barrages, nappe sous l'oued, puits, canaux en pierres plates (tissembades), puis partage entre les jardins.</p>`;
 document.getElementById("psoc").onclick=()=>speakList(SOCIETY.map(([a,b],i)=>({id:"soc-"+i,label:a,text:a+". "+b})));wireGo()}
function renderInfos(){view.innerHTML=`${backBtn()}<h2>Infos pratiques</h2><p class="daymeta">L'essentiel pour la vallée du M'Zab fin octobre.</p>
 <div class="stack">${PRACTICAL.map(p=>`<div class="card"><h3>${esc(p.h)}</h3><ul class="list">${p.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}
 <div class="card"><h3>Urgences en Algérie</h3><table class="pt"><tbody>${EMERGENCY.map(([a,n])=>`<tr><td>${esc(a)}</td><td class="contact">${n}</td></tr>`).join("")}</tbody></table><p class="small">Notez aussi le numéro de votre hébergement.</p></div></div>`;wireGo()}
function renderAddr(){const h=S.get("host",{});view.innerHTML=`${backBtn()}<h2>Adresses</h2><p class="daymeta">Je n'ai trouvé aucune adresse de restaurant ou de boutique que je puisse vérifier. Demandez ses adresses à votre hôte et notez-les ici : elles restent sur ce téléphone.</p>
 <div class="card host">${HOST_FIELDS.map(([k,l])=>`<label for="h-${k}">${esc(l)}<input id="h-${k}" data-h="${k}" value="${esc(h[k]||"")}" placeholder="Nom, quartier, ce qu'il faut y prendre"></label>`).join("")}</div>
 <div class="card" style="margin-top:10px"><h3>Où trouver quoi</h3><ul class="list"><li><strong>Tapis et poteries :</strong> sous les arcades de la place du marché de Ghardaïa.</li><li><strong>Marché à la criée :</strong> place Lalla Achou, à Béni Isguen, sauf le vendredi.</li><li><strong>Repas mozabites :</strong> surtout en maison d'hôtes, sur demande.</li></ul></div>`;
 view.querySelectorAll("[data-h]").forEach(i=>i.oninput=()=>{const v=S.get("host",{});v[i.dataset.h]=i.value;S.set("host",v)});wireGo()}
function renderRead(){view.innerHTML=`${backBtn()}<h2>Pour aller plus loin</h2><p class="daymeta">Seulement des références vérifiées.</p>
 <div class="stack">${BOOKS.map(b=>`<div class="card"><h3>${esc(b.t)}</h3><p class="small">${esc(b.a)} · ${esc(b.e)}</p><p>${esc(b.d)}</p></div>`).join("")}</div>`;wireGo()}

function renderSources(){view.innerHTML=`${backBtn()}<h2>Sources</h2><p class="daymeta">Les faits de l'application ont été vérifiés dans ces sources. Quand elles divergent, l'application le signale ou reste prudente.</p>
 <div class="card"><ul class="list">${SOURCES.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul></div>
 <div class="card" style="margin-top:10px"><div class="k">Points incertains</div><ul class="list"><li>Béni Isguen : la date de fondation varie selon les sources, du XIe au XVIe siècle.</li><li>L'heure exacte du marché à la criée : à confirmer le jour même.</li><li>Les tarifs des guides locaux et d'éventuels droits d'entrée : aucune source fiable.</li><li>Horaires des prières : calculés, à quelques minutes près.</li></ul></div>`;wireGo()}

function renderPrayers(){const n=algiersNow();const days=["2026-10-25","2026-10-26","2026-10-27"];const labels={"2026-10-25":"Dim. 25","2026-10-26":"Lun. 26","2026-10-27":"Mar. 27"};
 const nowM=toMin(n.hm);let nextKey=null;if(labels[n.date]){const t=dayTimes(n.date);const nx=PRAYERS.find(([k])=>toMin(hm(t[k]))>nowM);nextKey=nx?nx[0]:null}
 view.innerHTML=`<h2>Horaires des prières</h2><p class="daymeta">Ghardaïa · calculés pour la vallée (aube à 18°, nuit à 17°, Asr standard).</p>
 <div class="card scroll"><table class="pt"><thead><tr><th>Prière</th>${days.map(d=>`<th>${labels[d]}</th>`).join("")}</tr></thead><tbody>
 ${PRAYERS.map(([k,a,b])=>`<tr class="${n.date&&nextKey===k?"next":""}"><td>${a}${b?`<div class="small">${b}</div>`:""}</td>${days.map(d=>`<td>${hm(dayTimes(d)[k])}</td>`).join("")}</tr>`).join("")}
 </tbody></table></div>
 <div class="card" style="margin-top:10px"><p><strong>Pourquoi c'est utile pour vous :</strong></p><ul class="list">
  <li><strong>Asr</strong> : la vente aux enchères de Béni Isguen commence juste après.</li>
  <li><strong>Maghreb</strong> : c'est l'heure du coucher du soleil, pour la palmeraie et les dunes.</li>
  <li>Pendant les prières, certaines boutiques ferment quelques minutes et on évite les abords des mosquées.</li></ul></div>
 <p class="small" style="margin-top:8px">Horaires calculés, à quelques minutes près. Les mosquées de la vallée peuvent appliquer un léger décalage : l'appel à la prière fait foi.</p>`}

function renderKids(){const b=S.get("bingo",{});
 view.innerHTML=`<h2>Le coin des enfants</h2><p class="daymeta">Bingo du M'Zab pendant les visites, quiz le soir. Chaque étape a aussi sa version enfants à écouter.</p>
 <h2>Bingo du M'Zab</h2><div class="bingo">${BINGO.map(([ic,l],i)=>`<button type="button" id="bg${i}" data-bg="${i}" aria-pressed="${!!b[i]}"><span class="ic" aria-hidden="true">${ic}</span>${esc(l)}</button>`).join("")}</div>
 <p class="small" id="bgmsg" style="margin-top:6px"></p><button class="btn" type="button" id="bgreset">Nouvelle partie</button>
 <h2>Quiz du soir</h2><div class="card quiz">${QUIZ.map((q,i)=>`<div class="q"><strong>${i+1}. ${esc(q.q)}</strong><div class="opts">${q.o.map((o,j)=>`<button class="btn" type="button" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb${i}"></div></div>`).join("")}<p id="score" class="small"></p></div>`;
 const msg=()=>{const v=S.get("bingo",{}),c=Object.values(v).filter(Boolean).length;document.getElementById("bgmsg").textContent=c===BINGO.length?"Bingo complet ! Bravo les explorateurs.":`${c} sur ${BINGO.length} trouvés.`};msg();
 view.querySelectorAll("[data-bg]").forEach(x=>x.onclick=()=>{const v=S.get("bingo",{});v[x.dataset.bg]=!v[x.dataset.bg];S.set("bingo",v);x.setAttribute("aria-pressed",!!v[x.dataset.bg]);msg()});
 document.getElementById("bgreset").onclick=()=>{S.set("bingo",{});renderKids()};
 let score=0;const ans=new Set();
 view.querySelectorAll("[data-q]").forEach(x=>x.onclick=()=>{const i=+x.dataset.q,j=+x.dataset.o,q=QUIZ[i];if(ans.has(i))return;ans.add(i);
  view.querySelectorAll(`[data-q="${i}"]`).forEach(y=>{if(+y.dataset.o===q.a)y.classList.add("ok");else if(y===x)y.classList.add("ko")});
  if(j===q.a)score++;document.getElementById("fb"+i).textContent=(j===q.a?"Bravo ! ":"Presque. ")+q.f;
  if(ans.size===QUIZ.length)document.getElementById("score").textContent=`Score : ${score} sur ${QUIZ.length}`})}

function renderPratique(){const bag=S.get("bag",{});
 view.innerHTML=`<h2>Pratique</h2><p class="daymeta">Contacts, sac du jour, mots utiles.</p>
 <div class="grid2">
  <div class="card"><div class="k">Votre hébergement</div><p>Notez ici le nom et le numéro de votre hébergement, ou gardez-les dans vos contacts.</p></div>
  <div class="card"><div class="k">Lumière</div><p>Coucher du soleil vers <strong>${hm(dayTimes("2026-10-25").maghrib)}</strong>. Belle lumière dans les 45 minutes qui précèdent.</p><p>Prière du Asr vers <strong>${hm(dayTimes("2026-10-25").asr)}</strong> : voir l'onglet Prières.</p></div>
 </div>
 <h2>Voix des commentaires</h2><div class="card host">
  <label for="vmode">Voix utilisée<select id="vmode" class="btn" style="width:100%"><option value="naturelle">Voix enregistrée (recommandée)</option><option value="tel">Voix du téléphone</option></select></label>
  <label for="vrate">Vitesse : <span id="vrv"></span><input id="vrate" type="range" min="0.8" max="1.25" step="0.05"></label>
  <label for="vname">Voix du téléphone (secours)<select id="vname" class="btn" style="width:100%"></select></label>
  <div><button class="btn" type="button" id="vtest">▶ Tester</button></div>
  <p class="small">La voix enregistrée est une voix de synthèse neuronale française (« Siwis », données CC BY 4.0). Si un fichier manque, l'application bascule sur la voix du téléphone. Pour une meilleure voix du téléphone sur iPhone : Réglages → Accessibilité → Contenu énoncé → Voix → Français, version « Améliorée ».</p></div>
 <h2>Sac du jour</h2><div class="card check"><ul>${BAG.map((x,i)=>`<li><label><input type="checkbox" id="b${i}" data-b="${i}" ${bag[i]?"checked":""}> ${esc(x)}</label></li>`).join("")}</ul><div><button class="btn" type="button" id="resetbag">Tout décocher</button></div></div>
 <h2>Mots utiles en darija</h2><div class="card phr">${PHRASES.map(([fr,ar],i)=>`<div><div class="ar">${esc(ar)}</div><div class="fr">${esc(fr)}</div></div><button class="btn" type="button" data-ph="${i}" aria-label="Écouter ${esc(fr)}">▶</button>`).join("")}</div>
 <p class="small">La voix française prononce la darija de façon approximative.</p>`;
 const vm=document.getElementById("vmode"),vr=document.getElementById("vrate"),vn=document.getElementById("vname"),vrv=document.getElementById("vrv");
 vm.value=MODE;vr.value=RATE;vrv.textContent="×"+RATE;
 const fillV=()=>{const L=frVoices();vn.innerHTML=L.length?L.map(v=>`<option value="${esc(v.name)}" ${voice&&v.name===voice.name?"selected":""}>${esc(v.name)}</option>`).join(""):`<option>Aucune voix française trouvée</option>`};fillV();if(synth)synth.addEventListener("voiceschanged",fillV);
 vm.onchange=()=>{MODE=vm.value;S.set("voiceMode",MODE)};vr.oninput=()=>{RATE=+vr.value;S.set("voiceRate",RATE);vrv.textContent="×"+RATE};
 vn.onchange=()=>{VNAME=vn.value;S.set("voiceName",VNAME);pickVoice()};
 document.getElementById("vtest").onclick=()=>speakList([{id:"j1-0",label:"Test de la voix",text:"Bienvenue à Ghardaïa. Ceci est un test de la voix."}]);
 view.querySelectorAll("[data-b]").forEach(c=>c.onchange=()=>{const v=S.get("bag",{});v[c.dataset.b]=c.checked;S.set("bag",v)});
 document.getElementById("resetbag").onclick=()=>{S.set("bag",{});renderPratique()};
 view.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const [fr,ar]=PHRASES[+b.dataset.ph];speakList([{label:fr,text:ar}])});}

/* ===================== BANDEAU ===================== */
function renderNow(){const n=algiersNow(),el=document.getElementById("now"),nowM=toMin(n.hm);
 const inStay=["2026-10-25","2026-10-26","2026-10-27"].includes(n.date)||n.date==="2026-10-24";
 if(!inStay&&n.date>"2026-10-27"){el.innerHTML=`<span>Séjour à Ghardaïa terminé. Bon retour à Oran.</span>`;return}
 const t=dayTimes(n.date>="2026-10-24"?n.date:"2026-10-25");const ss=toMin(hm(t.maghrib));
 const nx=PRAYERS.filter(([k])=>k!=="sunrise").find(([k])=>toMin(hm(t[k]))>nowM);
 let sun;const left=ss-nowM;
 if(left>360)sun=`Coucher du soleil à <b>${hm(t.maghrib)}</b>`;
 else if(left>45)sun=`Coucher du soleil à <b>${hm(t.maghrib)}</b> · belle lumière dans <b>${Math.floor((left-45)/60)?Math.floor((left-45)/60)+" h "+String((left-45)%60).padStart(2,"0"):((left-45)%60)+" min"}</b>`;
 else if(left>0)sun=`<b>Belle lumière maintenant</b> · coucher du soleil dans <b>${left} min</b>`;
 else sun=`Soleil couché à ${hm(t.maghrib)}`;
 const d=DAYS.find(x=>x.date===n.date);let step="";
 if(d){const c=currentStop(d,n.hm);const s=c!=null?d.stops[c]:d.stops[0];step=`<span>${c!=null?"En ce moment":"Prochaine étape"} : <b>${esc(s.name)}</b></span>`}
 else if(n.date<"2026-10-25")step=`<span>Première visite <b>dim. 25 à 9h00</b> : ksar de Ghardaïa.</span>`;
 el.innerHTML=`<div class="row"><span>Il est <b>${n.hm}</b> à Ghardaïa.</span>${step}</div><div class="row"><span>${sun}</span>${nx?`<span>Prochaine prière : <b>${nx[1]} ${hm(t[nx[0]])}</b></span>`:""}</div>`}

/* ===================== ROUTAGE ===================== */
function show(id){S.set("tab",id);renderTabs(id);synth&&synth.cancel();player.hidden=true;const d=DAYS.find(x=>x.id===id);
 const R={guide:renderGuide,mzab:renderMzab,incontournables:renderMust,carte:renderMap,manger:renderFood,acheter:renderBuy,savoirvivre:renderManners,ciel:renderSky,prieres:renderPrayers,sources:renderSources,balades:renderWalks,comprendre:renderUnderstand,infos:renderInfos,adresses:renderAddr,lire:renderRead,"w-ghardaia":()=>renderWalk("w-ghardaia"),"w-beniisguen":()=>renderWalk("w-beniisguen"),enfants:renderKids,pratique:renderPratique};
 if(d)renderDay(d);else(R[id]||renderGuide)();window.scrollTo({top:0})}

renderNow();setInterval(renderNow,30000);
const today=DAYS.find(d=>d.date===algiersNow().date);
const ALL=[...TABS.map(t=>t.id),...GUIDE.map(g=>g.id),"w-ghardaia","w-beniisguen"];
const hash=(location.hash||"").slice(1);
show(ALL.includes(hash)?hash:(today?today.id:S.get("tab","j1")));

/* Hors ligne (seulement sur le site GitHub Pages) */
if("serviceWorker" in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
